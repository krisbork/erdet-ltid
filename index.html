<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Er det øltid?</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      margin: 0;
    }
    #svar {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: bold;
      margin: 0;
    }
    .ja {
      color: #00c853;
    }
    .nej {
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Er det øltid?</h1>
  <p id="svar"></p>
  <script>
    function opdater() {
      const parametre = new URLSearchParams(window.location.search);
      const jaVaerdi = parametre.get("ja");
      const planlagtJa = /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d$/.test(jaVaerdi || "");

      // Dansk tid uanset hvor besøgende er
      const now = new Date();
      const parts = new Intl.DateTimeFormat("da-DK", {
        timeZone: "Europe/Copenhagen",
        weekday: "short",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
      }).formatToParts(now);

      const weekday = parts.find(p => p.type === "weekday").value;
      const hour = parseInt(parts.find(p => p.type === "hour").value, 10);
      const part = type => parts.find(p => p.type === type).value;
      const danskDatoTid = `${part("year")}-${part("month")}-${part("day")}T${part("hour")}:${part("minute")}`;

      const almindeligOeltid = weekday.startsWith("fre") && hour >= 14;
      const erOeltid = planlagtJa
        ? danskDatoTid >= jaVaerdi
        : parametre.has("ja") || almindeligOeltid;

      const svar = document.getElementById("svar");
      svar.textContent = erOeltid ? "Ja" : "Nej";
      svar.className = erOeltid ? "ja" : "nej";
    }

    opdater();
    setInterval(opdater, 1000);
  </script>
</body>
</html>
